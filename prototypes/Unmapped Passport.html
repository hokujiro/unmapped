<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ───────────────────────── shared visual atoms ───────────────────────── */

const StripePh = ({ color = '#1f5d3a', label, style }) => (
  <div style={{
    backgroundColor: color,
    backgroundImage: 'repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0, rgba(255,255,255,0.08) 1px, transparent 1px, transparent 14px)',

/* ──────────────────────────── MOBILE PASSPORT ────────────────────────────
   The "wow" — full-screen takeover, large illustrative passport card,
   layered chips, depth, scrollable body, sharing actions docked.
─────────────────────────────────────────────────────────────────────────── */

function PassportMobile() {
  // tilt on touch / scroll for a tiny bit of life
  const [tilt, setTilt] = useState({ x: -2, y: 3 });
  const cardRef = useRef(null);
  const [showProof, setShowProof] = useState(null); // skill key

  return (
    <div style={{
      position:'absolute', inset:0,
      background:'linear-gradient(180deg, #f6f1e7 0%, #efe8d8 60%, #ecf3e8 100%)',
      overflowY:'auto', overflowX:'hidden',
      fontFamily:"'Plus Jakarta Sans', sans-serif", color:'var(--ink)',

      {/* Top app chrome */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 20px 8px'}}>

      {/* Hero greeting */}

      {/* THE PASSPORT CARD — the wow object */}

        margin:'24px 22px 14px', position:'relative', perspective:'1200px'

          position:'absolute', inset:'-6px 12px 12px -8px', borderRadius:28,

        }}/>

          position:'absolute', inset:'2px -10px 6px 10px', borderRadius:28,
          background:'#e26a4a', transform:'rotate(2deg)', zIndex:1
        }}/>

        {/* main card */}

          position:'relative', zIndex:2,
          borderRadius:28,
          background:'linear-gradient(165deg, #1f5d3a 0%, #103a23 100%)',

            <div key={s.name} style={{

              <button onClick={()=>setShowProof(open?null:i)} style={{
                width:'100%', textAlign:'left', background:'transparent', border:'none', padding:14,
                display:'flex', gap:12, alignItems:'center', cursor:'pointer', fontFamily:'inherit'
              }}>
                <div style={{
                  width:42, height:42, borderRadius:12,
                  background: s.durable ? '#ecf3e8' : '#fbe6dd',
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize:18

                  <p className="mono" style={{margin:'2px 0 0', fontSize:9.5, color:'#8a978f'}}>{s.tag}</p>

                  </div>
                </div>

        <h2 className="display" style={{margin:0, fontSize:22, fontWeight:500}}>Languages</h2>

              <span style={{fontSize:11, color:'#5b6b62'}}>{L.lev}</span>
            </div>
          </div>

      </div>

      {/* Why it matters */}
      <div style={{margin:'8px 22px 22px', padding:'18px 18px 16px', borderRadius:20, background:'#fbe6dd', border:'1px solid #f3c8b6'}}>
        <p style={{margin:0, fontFamily:'JetBrains Mono', fontSize:9, letterSpacing:1.5, color:'#b8492a', textTransform:'uppercase'}}>What changes with this passport</p>
        <p className="serif-italic" style={{margin:'8px 0 0', fontSize:16, lineHeight:1.5, color:'#7d3520'}}>
          Until today your skills lived in a notebook. Now they're searchable by 1,247 employers and NGOs across West Africa — without anyone seeing your name unless you say so.
        </p>
      </div>

      {/* Sticky-feel bottom action bar */}
      <div style={{
        position:'sticky', bottom:0, padding:'14px 18px 28px',
        background:'linear-gradient(180deg, transparent, #ecf3e8 30%)',
        display:'flex', gap:10
      }}>
        <button style={{
          flex:1, padding:'14px 18px', borderRadius:18, border:'none',
          background:'#1f5d3a', color:'#fff', fontWeight:700, fontSize:14, fontFamily:'inherit',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          boxShadow:'0 12px 24px -10px rgba(31,93,58,0.5)'
        }}>
          <span>↗</span> Share
        </button>
        <button style={{
          width:54, padding:'14px 0', borderRadius:18, border:'1px solid #c8debc',
          background:'#fff', color:'#1f5d3a', fontSize:18, fontFamily:'inherit'
        }}>↓</button>
        <button style={{
          width:54, padding:'14px 0', borderRadius:18, border:'1px solid #c8debc',
          background:'#fff', color:'#1f5d3a', fontSize:18, fontFamily:'inherit'
        }}>⬚</button>
      </div>
    </div>
  );
}

          <h2 className="display" style={{margin:0, fontSize:22, fontWeight:500}}>Verified skills</h2>

        <div style={{marginTop:12, border:'1px solid #d8cfba', borderRadius:14, overflow:'hidden', background:'#fdfaf2'}}>

          {[
            {name:'Mobile electronics repair', code:'ESCO S6.2.1 · O*NET 49-2094', dur:true, ev:'Hands-on, with place and tools.'},
            {name:'Customer service', code:'ESCO S1.6.1', dur:true, ev:'High-context, de-escalating language with customers.'},

          ].map((r,i,arr)=>(
            <div key={r.name} style={{
              display:'grid', gridTemplateColumns:'2fr 1fr 110px',
              padding:'12px 14px',
              borderTop: i===0 ? 'none' : '1px solid #e6dec8',
              alignItems:'center', gap:10
            }}>
              <div>
                <p style={{margin:0, fontWeight:600, fontSize:13}}>{r.name}</p>
                <p className="serif-italic" style={{margin:'4px 0 0', fontSize:11.5, color:'#5b6b62', lineHeight:1.45}}>{r.ev}</p>
              </div>
              <p className="mono" style={{margin:0, fontSize:9.5, color:'#8a978f'}}>{r.code}</p>
              <span style={{
                justifySelf:'end', padding:'4px 10px', borderRadius:999, fontSize:10, fontWeight:600,
                background: r.dur ? '#ecf3e8' : '#fbe6dd',

                border:'1px solid', borderColor: r.dur ? '#c8debc' : '#f3c8b6'
              }}>
                {r.dur ? '● durable' : '○ AI-vulnerable'}
              </span>
            </div>
          ))}
        </div>
      </section>

      {/* Two-up: education & languages */}
      <section style={{marginTop:22, display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
        <div style={{padding:14, borderRadius:14, background:'#fdfaf2', border:'1px solid #e6dec8'}}>
          <p className="mono" style={{margin:0, fontSize:9, letterSpacing:1.5, color:'#8a978f', textTransform:'uppercase'}}>Education</p>
          <p style={{margin:'8px 0 0', fontSize:13, fontWeight:600}}>Upper secondary — completed</p>
          <p style={{margin:'2px 0 0', fontSize:11.5, color:'#5b6b62'}}>Accra Senior High School · 2022</p>
          <div style={{height:1, background:'#e6dec8', margin:'10px 0'}}/>
          <p className="mono" style={{margin:0, fontSize:9, letterSpacing:1.5, color:'#8a978f', textTransform:'uppercase'}}>Availability</p>
          <p style={{margin:'8px 0 0', fontSize:13, fontWeight:600}}>Full-time · willing to relocate within Ghana</p>
        </div>
        <div style={{padding:14, borderRadius:14, background:'#fdfaf2', border:'1px solid #e6dec8'}}>
          <p className="mono" style={{margin:0, fontSize:9, letterSpacing:1.5, color:'#8a978f', textTransform:'uppercase'}}>Languages</p>
          <div style={{display:'flex', flexDirection:'column', gap:8, marginTop:8}}>
            {[{l:'Twi', lev:'Native'}, {l:'English', lev:'B1 · conversational'}].map(L=>(
              <div key={L.l} style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <span style={{fontWeight:600, fontSize:13}}>{L.l}</span>
                <span style={{fontSize:11.5, color:'#5b6b62'}}>{L.lev}</span>
              </div>
            ))}
          </div>
          <div style={{height:1, background:'#e6dec8', margin:'10px 0'}}/>
          <p className="mono" style={{margin:0, fontSize:9, letterSpacing:1.5, color:'#8a978f', textTransform:'uppercase'}}>Country profile</p>
          <p style={{margin:'8px 0 0', fontSize:11.5, color:'#5b6b62', lineHeight:1.5}}>Ghana — informal employment 67%. Sectors aligned to this profile: trade & retail, renewable energy, telco services.</p>
        </div>
      </section>

      {/* Footer transparency */}
      <footer style={{position:'absolute', left:52, right:52, bottom:36}}>
        <div style={{height:1, background:'#d8cfba', marginBottom:14}}/>
        <div style={{display:'grid', gridTemplateColumns:'1.5fr 1fr', gap:18, alignItems:'flex-end'}}>
          <div>
            <p className="mono" style={{margin:0, fontSize:9, letterSpacing:1.5, color:'#8a978f', textTransform:'uppercase'}}>Methodology</p>
            <p style={{margin:'6px 0 0', fontSize:10.5, color:'#5b6b62', lineHeight:1.55}}>
              Skills extracted from a self-narrated story by an LLM-assisted classifier and aligned to ESCO v1.2.0 / O*NET 28.0. Durability rating draws on ILO Working Paper 140 (2024) — task-level AI exposure scores. Verified at issuance; revocable.
            </p>
          </div>
          <div style={{
            border:'1.5px dashed #d8cfba', borderRadius:12, padding:'10px 12px',
            display:'flex', alignItems:'center', gap:10
          }}>
            {/* QR placeholder */}
            <div style={{
              width:54, height:54, background:'#16241c', borderRadius:6,
              backgroundImage:'repeating-linear-gradient(0deg, #f6f1e7 0 4px, transparent 4px 8px), repeating-linear-gradient(90deg, #f6f1e7 0 4px, transparent 4px 8px)'
            }}/>
            <div>
              <p className="mono" style={{margin:0, fontSize:9, letterSpacing:1.5, color:'#8a978f', textTransform:'uppercase'}}>Verify</p>
              <p style={{margin:'4px 0 0', fontSize:11, fontWeight:600}}>unmapped.org/v/<br/>UMP·GHA·24·0921·AK</p>
            </div>
          </div>
        </div>
      </footer>
    </div>
  );
}
